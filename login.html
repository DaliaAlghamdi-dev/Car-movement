<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - مراقب السيارات</title>
  <link rel="icon" href="car.png" type="image/x-icon" />

  <style>
    body {
      font-family: Helvetica NeueLT Arabic, sans-serif;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      margin: 0;
      padding: 0;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.25);
      z-index: -1;
    }

    .login-container {
      max-width: 500px;
      display: flex;
      flex-direction: column; /* Changed to column to stack elements */
      margin: 100px auto;
      background-color: #EFEFEF;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      height: 500px; /* Made the box taller */
      justify-content: space-between; /* Distributes space between elements */
    }

    .login-form {
      flex: 1; /* Allows the form to take available space */
      padding: 30px;
      color: white;
    }

    .login-form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: rgb(0,170,148); /* Changed color for better visibility */
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
      color:rgb(0,170,148);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      box-sizing: border-box;
      background-color: #f0f0f0;
    }

    button[type="submit"] {
      background-color: #2b196b;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 24px;
      cursor: pointer;
      margin-top: 20px;
    }

    .login-image {
      padding: 20px;
      display: flex;
      justify-content:left; /* Aligns to the left */
      align-items: flex-end; /* Aligns to the bottom */
      flex-grow: 0; /* Prevents image section from growing */
    }

    .login-image img {
      max-width: 100px; /* Adjusted image size to be smaller */
      max-height: 100px; /* Adjusted image size to be smaller */
      border-radius: 12px;
      object-fit: contain; /* Ensures the image fits within its bounds without cropping */
    }

    .header-login {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgb(43, 25, 107);
      color: white;
      padding: 20px;
    }

    .logo {
      width: 110px;
      height: 50px;
    }

    .header-buttons a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      margin-right: 15px;
    }

    .header-buttons a:hover {
      color: #ccc;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #eee;
      text-align: center;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header class="header-login">
    <img src="images_logos_Amana_Arabic_png (1).png" alt="شعار المستخدم" class="logo" />
    <div class="header-buttons">
    </div>
  </header>

<div class="login-container">
  <div class="login-form">
    <h2>تسجيل الدخول</h2>
    <form action="login.php" method="post">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" name="username" required>

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">دخول</button>
    </form>
  </div>
  <div class="login-image">
    <img src="car.png" alt="صورة تسجيل الدخول">
  </div>
</div>

  <footer>
    &copy; 2023 حركة السيارات. جميع الحقوق محفوظة.
  </footer>

</body>
</html>
